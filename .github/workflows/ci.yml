name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: Tag that must match VERSION
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 / ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: ./scripts/get-version.ps1 -Tag $env:RELEASE_TAG
      - name: Build and test
        env:
          BUILD_CONFIGURATION: ${{ matrix.configuration }}
        run: ./scripts/build.ps1 -Configuration $env:BUILD_CONFIGURATION
      - name: Package portable release
        if: matrix.configuration == 'Release'
        run: ./scripts/package.ps1
      - name: Upload portable release
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macropulse-windows-x64-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs-${{ matrix.configuration }}
          path: build/Testing/Temporary/*.log
          if-no-files-found: ignore
          retention-days: 7
